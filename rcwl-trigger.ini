# rcwl-trigger: azioni da eseguire quando il sensore RCWL-0516 rileva
# un "premuto". File riletto ad ogni trigger: le modifiche si applicano
# subito, senza bisogno di riavviare il servizio (tranne [gpio] pin, che
# richiede un riavvio).

[gpio]
# Numero GPIO (BCM) collegato all'uscita OUT del modulo RCWL-0516.
pin = 17
# Letture ravvicinate consecutive richieste per confermare il trigger
# (debounce, come RCWL_TRIGGER_COUNT in sensortest.py).
conferme = 3
# Intervallo di polling del sensore, in secondi.
intervallo = 0.2
# Secondi di attesa dopo la fine del comando prima di riarmare il trigger,
# in aggiunta al requisito che il sensore sia tornato confermato inattivo.
cooldown = 20

[azione]
# Unit systemd --user da fermare quando scatta il trigger; viene
# riavviata automaticamente al termine di run_command.
stop_service = monitorpm.service
# Comando da eseguire (bloccante: il servizio attende che termini prima
# di riarmare il trigger e riavviare stop_service). Eseguito senza shell,
# quindi va bene un percorso con argomenti separati da spazi ma niente
# pipe/redirezioni.
run_command = /opt/scripts/nodstream/run.sh
# Durata massima in secondi di run_command: superata, riceve SIGTERM
# (e se non basta SIGKILL dopo 10s). Protegge da esecuzioni infinite se
# il sensore resta bloccato attivo. 0 = nessun limite.
timeout_massimo = 1800
